{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
    <h1>회원가입</h1>

    {% if disabled %}
        <p class="notice error">현재 관리자에 의해 회원가입이 중단되었습니다.</p>
        <p class="switch">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
    {% else %}
        <form method="post" action="{{ url_for('signup') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">아이디</label>
            <input type="text" id="username" name="username" value="{{ username }}" required autofocus minlength="3">

            <label for="email">이메일 <span class="hint">(비밀번호 찾기에 사용, 선택)</span></label>
            <input type="email" id="email" name="email" value="{{ email }}">

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required minlength="6">

            <label for="confirm">비밀번호 확인</label>
            <input type="password" id="confirm" name="confirm" required minlength="6">

            <button type="submit">가입하기</button>
        </form>

        <p class="switch">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
    {% endif %}
{% endblock %}
