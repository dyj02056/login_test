{% extends "base.html" %}
{% block title %}비밀번호 재설정{% endblock %}
{% block content %}
    <h1>비밀번호 재설정</h1>

    <form method="post" action="{{ url_for('reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="password">새 비밀번호</label>
        <input type="password" id="password" name="password" required autofocus minlength="6">

        <label for="confirm">새 비밀번호 확인</label>
        <input type="password" id="confirm" name="confirm" required minlength="6">

        <button type="submit">재설정하기</button>
    </form>

    <p class="switch"><a href="{{ url_for('login') }}">로그인으로 돌아가기</a></p>
{% endblock %}
