{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
    <h1>비밀번호 변경</h1>

    <form method="post" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="old_password">현재 비밀번호</label>
        <input type="password" id="old_password" name="old_password" required autofocus>

        <label for="new_password">새 비밀번호</label>
        <input type="password" id="new_password" name="new_password" required minlength="6">

        <label for="confirm">새 비밀번호 확인</label>
        <input type="password" id="confirm" name="confirm" required minlength="6">

        <button type="submit">변경하기</button>
    </form>

    <p class="switch"><a href="{{ url_for('dashboard') }}">대시보드로 돌아가기</a></p>
{% endblock %}
