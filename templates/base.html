<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Site{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <div class="page">
        <div class="card {% block card_class %}{% endblock %}">
            {% if current_is_admin %}
                <nav class="nav">
                    <a href="{{ url_for('admin_panel') }}">대시보드</a>
                    <a href="{{ url_for('admin_users') }}">회원 관리</a>
                    <a href="{{ url_for('admin_logs') }}">로그인 기록</a>
                    <a href="{{ url_for('admin_stats') }}">통계</a>
                </nav>
            {% endif %}

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="notice {{ category }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
